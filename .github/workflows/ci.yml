name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Smart contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stablepay-smart
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stablepay-back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: stablepay-back/.nvmrc
          cache: npm
          cache-dependency-path: stablepay-back/package-lock.json

      - run: npm ci

      - name: Build (prisma generate + tsc)
        run: npm run build

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stablepay-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stablepay-front/package-lock.json

      - run: npm ci

      # RainbowKit refuses to build with an empty WalletConnect project ID,
      # so CI uses the example env with a placeholder ID.
      - name: Create .env for the build
        run: |
          cp .env.example .env
          sed -i 's/^NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=""/NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID="ci-placeholder"/' .env

      - name: Build
        run: npm run build
