[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinna Solidity-version så att alla bygger med exakt samma kompilator
solc_version = "0.8.28"

# Optimizer: minskar gas-kostnad vid deploy och anrop (200 runs = bra balans)
optimizer = true
optimizer_runs = 200
via_ir = true

# EVM-version: Cancun stödjer de senaste opkoderna (t.ex. transient storage)
evm_version = "cancun"

# CI-profil: kör fler fuzz-rundor i pipeline för att hitta edge cases
[profile.ci]
fuzz.runs = 256
